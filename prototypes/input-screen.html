<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="icon" href="data:," />
	<title>StyleScope Input Prototype</title>
	<style>
		:root {
			--bg: #f4f3f0;
			--ink: #1d1d1d;
			--muted: #585858;
			--quiet: #9e9e9e;
			--line: #dbdbdb;
			--panel: #e9e8e5;
			--panel-light: #f8f7f4;
			--dark: #1d1d1d;
			--footer: #1b1b1b;
			--radius: 10px;
			--font-jp: "Hiragino Sans", "Yu Gothic", "YuGothic", "Noto Sans JP", system-ui,
				sans-serif;
			--font-body: "Adobe Caslon Pro", var(--font-jp);
			--font-display: "Adobe Caslon Pro", "Times New Roman", var(--font-jp), serif;
			font-family: var(--font-body);
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			background: var(--bg);
			color: var(--ink);
			font-size: 15px;
			line-height: 1.65;
		}

		a,
		button,
		input {
			font: inherit;
		}

		a {
			color: inherit;
			text-decoration: none;
		}

		.page {
			display: flex;
			flex-direction: column;
			min-height: 100vh;
		}

		.topbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			min-height: 88px;
			padding: 24px 40px 0;
		}

		.brand {
			font-family: var(--font-display);
			font-size: 28px;
			line-height: 1;
			letter-spacing: 0;
		}

		.top-actions {
			display: flex;
			gap: 10px;
			align-items: center;
		}

		.icon-button {
			display: inline-grid;
			place-items: center;
			width: 44px;
			height: 44px;
			border: 1px solid var(--line);
			border-radius: var(--radius);
			background:
				radial-gradient(circle at 50% 50%, rgba(229, 229, 226, 0.92), rgba(244, 243, 240, 0.95)),
				var(--panel-light);
			color: #777;
			font-size: 18px;
			font-weight: 700;
		}

		.icon-button:hover,
		.icon-button:focus-visible {
			border-color: #a9a9a9;
			outline: none;
		}

		.demo {
			display: grid;
			grid-template-rows: auto auto auto;
			justify-items: center;
			gap: 52px;
			width: min(100%, 1300px);
			margin: 0 auto;
			padding: 10px 40px 64px;
			flex: 1;
		}

		.hero {
			text-align: center;
			padding-top: 4px;
		}

		h1 {
			margin: 0;
			font-family: var(--font-display);
			font-size: clamp(34px, 4vw, 42px);
			font-weight: 400;
			line-height: 1.18;
			letter-spacing: 0;
		}

		.hero p {
			margin: 6px 0 0;
			font-family: var(--font-body);
			font-size: 16px;
			color: var(--ink);
		}

		.dropzone {
			display: grid;
			place-items: center;
			width: min(100%, 1100px);
			min-height: 348px;
			border: 1px solid var(--line);
			border-radius: 20px;
			background:
				radial-gradient(ellipse at 50% 52%, rgba(229, 229, 226, 0.92), rgba(234, 233, 230, 0.78) 45%, rgba(244, 243, 240, 0.5) 74%),
				var(--panel);
			padding: 56px 28px;
			text-align: center;
		}

		.dropzone-inner {
			display: grid;
			justify-items: center;
			gap: 18px;
			max-width: 420px;
		}

		.folder-icon {
			width: 36px;
			height: 36px;
			color: #a0a0a0;
		}

		.drop-copy {
			display: grid;
			gap: 10px;
			color: var(--muted);
		}

		.drop-copy h2 {
			margin: 0;
			font-size: 18px;
			font-weight: 400;
			line-height: 1.55;
		}

		.drop-copy p {
			margin: 0;
			font-size: 13px;
			line-height: 1.65;
		}

		.file-button {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			min-height: 44px;
			border: 1px solid var(--dark);
			border-radius: 8px;
			padding: 10px 18px;
			background: var(--dark);
			color: #fefdfb;
			font-size: 14px;
			font-weight: 400;
		}

		.file-button:hover,
		.file-button:focus-visible {
			background: #000;
			outline: none;
		}

		.text-bar {
			display: grid;
			grid-template-columns: minmax(0, 1fr) 50px;
			align-items: center;
			gap: 12px;
			width: min(100%, 680px);
			min-height: 60px;
			border: 1px solid var(--line);
			border-radius: var(--radius);
			background:
				radial-gradient(circle at 50% 50%, rgba(229, 229, 226, 0.86), rgba(234, 233, 230, 0.88)),
				var(--panel-light);
			padding: 5px 5px 5px 22px;
		}

		.text-bar input {
			width: 100%;
			min-width: 0;
			border: 0;
			background: transparent;
			color: var(--muted);
			font-size: 15px;
			outline: none;
		}

		.text-bar input::placeholder {
			color: var(--muted);
			opacity: 1;
		}

		.submit-button {
			display: grid;
			place-items: center;
			width: 50px;
			height: 50px;
			border: 0;
			border-radius: 8px;
			background: var(--dark);
			color: #fefdfb;
			cursor: pointer;
		}

		.submit-button:hover,
		.submit-button:focus-visible {
			background: #000;
			outline: none;
		}

		.footer {
			display: grid;
			grid-template-columns: 1fr auto 1fr;
			align-items: center;
			min-height: 59px;
			padding: 0 24px;
			background: var(--footer);
			color: #8b8b8b;
			font-size: 14px;
		}

		.footer small {
			justify-self: center;
			font-size: 14px;
		}

		.footer-links {
			display: flex;
			gap: 22px;
			justify-self: end;
		}

		.sr-only {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			margin: -1px;
			overflow: hidden;
			clip: rect(0, 0, 0, 0);
			white-space: nowrap;
			border: 0;
		}

		@media (max-width: 760px) {
			.topbar {
				min-height: 72px;
				padding: 18px 20px 0;
			}

			.brand {
				font-size: 24px;
			}

			.icon-button {
				width: 40px;
				height: 40px;
			}

			.demo {
				gap: 28px;
				padding: 18px 20px 42px;
			}

			h1 {
				font-size: 34px;
			}

			.hero p {
				font-size: 14px;
			}

			.dropzone {
				min-height: 310px;
				border-radius: 14px;
				padding: 36px 20px;
			}

			.drop-copy h2 {
				font-size: 17px;
			}

			.text-bar {
				grid-template-columns: minmax(0, 1fr) 48px;
				min-height: 58px;
				padding-left: 16px;
			}

			.text-bar input {
				font-size: 13px;
			}

			.submit-button {
				width: 48px;
				height: 48px;
			}

			.footer {
				grid-template-columns: 1fr;
				gap: 8px;
				padding: 18px 20px;
				text-align: center;
			}

			.footer-links {
				justify-self: center;
			}
		}
	</style>
</head>
<body>
	<div class="page">
		<header class="topbar" aria-label="Input navigation">
			<a class="brand" href="input-screen.html">StyleScope</a>
			<div class="top-actions">
				<a class="icon-button" href="#" aria-label="ヘルプ">?</a>
				<a class="icon-button" href="result-screen.html" aria-label="Result demoを開く">↗</a>
			</div>
		</header>

		<main class="demo">
			<section class="hero" aria-labelledby="inputTitle">
				<h1 id="inputTitle">What “Style” do you want?</h1>
				<p>どんなデザインスタイルをさがしていますか？</p>
			</section>

			<section class="dropzone" aria-labelledby="dropTitle">
				<div class="dropzone-inner">
					<svg class="folder-icon" viewBox="0 0 40 40" fill="none" aria-hidden="true" focusable="false">
						<path d="M8 13.5h9.1l2.4 3H32c1.1 0 2 .9 2 2v2H6v-5c0-1.1.9-2 2-2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
						<path d="M6 20.5h28l-3 11H9L6 20.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
					</svg>
					<div class="drop-copy">
						<h2 id="dropTitle">スタイル名を知りたいファイルを<br />ドラッグ＆ドロップ</h2>
						<p>参考画像または雰囲気の言葉を入れると<br />スタイルの雰囲気・検索ワード・AI指示を提案します</p>
					</div>
					<a class="file-button" href="result-screen.html">またはファイルを選択</a>
				</div>
			</section>

			<form class="text-bar" action="result-screen.html" aria-label="スタイルイメージ入力">
				<label class="sr-only" for="styleText">スタイルイメージ</label>
				<input id="styleText" name="style" type="text" placeholder="例：modern editorial web gallery design" />
				<button class="submit-button" type="submit" aria-label="分析する">
					<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
						<path d="M5 12h13M13 7l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
					</svg>
				</button>
			</form>
		</main>

		<footer class="footer">
			<span aria-hidden="true"></span>
			<small>© 2026 TSUQREA Inc.</small>
			<div class="footer-links">
				<a href="#">PrivacyPolicy</a>
				<a href="#">Contact</a>
			</div>
		</footer>
	</div>
</body>
</html>
